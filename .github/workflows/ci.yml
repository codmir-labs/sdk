name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:agent-kit
      - run: npm run build
      - run: npm run check:dist
      # The dist cases in root-entry.test.ts skip without a build, so run them after one (CSL-5375).
      - run: npx vitest run src/__tests__/root-entry.test.ts
      # rrweb must stay out of every bundle but /replay; skips without a build too (CSL-5612).
      - run: npx vitest run src/replay/__tests__/dist-bundles.test.ts
      # The sample app against a local capture server: an error, a 3-span trace and a masked replay (CSL-5588).
      # Headed Chrome under Xvfb, never headless. The runner image has google-chrome and xvfb-run; Node 20 only.
      - name: Example smoke (examples/fullstack-basic)
        if: matrix.node-version == 20
        timeout-minutes: 5
        working-directory: examples/fullstack-basic
        run: |
          # No lockfile: a `file:../..` dependency does not round-trip through `npm ci` on a clean checkout.
          npm install --no-audit --no-fund
          npm run smoke

  release:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
