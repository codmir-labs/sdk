name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Releases are manual: a maintainer runs this workflow on main from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The repository is public: no ticket key, private name or personal address in a tracked file or its name.
      - run: npm run check:words
      - run: npm test
      - run: npm run test:agent-kit
      - run: npm run build
      - run: npm run check:dist
      # The dist cases in root-entry.test.ts skip without a build, so run them after one.
      - run: npx vitest run src/__tests__/root-entry.test.ts
      # One client for every entry point, under require and under import: each case in a new Node process.
      - run: npx vitest run src/__tests__/dist-one-client.test.ts
      # verify() against a server that never answers, from the built dist: the process must end on its own.
      - run: npx vitest run src/verify/__tests__/verify.test.ts
      # rrweb must stay out of every bundle but /replay; skips without a build too.
      - run: npx vitest run src/replay/__tests__/dist-bundles.test.ts
      # Every entry but the four Node-only ones must bundle for the browser with esbuild and vite: no Node built-in in
      # it or any chunk it loads. Skips without a build too.
      - run: npx vitest run src/__tests__/browser-bundle.test.ts
      # The codmir-logs command as a child process; skips without a build too.
      - run: npx vitest run src/logs/__tests__/cli.test.ts
      # The sample app against a local capture server: an error, a 3-span trace and a masked replay.
      # Headed Chrome under Xvfb, never headless. The runner image has google-chrome and xvfb-run; Node 20 only.
      - name: Example smoke (examples/fullstack-basic)
        if: matrix.node-version == 20
        timeout-minutes: 5
        working-directory: examples/fullstack-basic
        run: |
          # No lockfile: a `file:../..` dependency does not round-trip through `npm ci` on a clean checkout.
          npm install --no-audit --no-fund
          npm run smoke
      # codmir-logs on nine small logs with one planted bug, the network refused. Node 20 only.
      - name: Log-read smoke (examples/log-read)
        if: matrix.node-version == 20
        timeout-minutes: 5
        working-directory: examples/log-read
        run: |
          # No lockfile, for the same reason as above.
          npm install --no-audit --no-fund
          npm run smoke
      # next build of a client component, app/error.tsx, pages/_app.tsx and an instrumentation.ts next to a middleware,
      # each importing @codmir/sdk/nextjs, then a check that the SDK is in each bundle. Node 20 only.
      - name: Next.js build smoke (examples/nextjs-build)
        if: matrix.node-version == 20
        timeout-minutes: 5
        working-directory: examples/nextjs-build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          # No lockfile, for the same reason as above.
          npm install --no-audit --no-fund
          npm run smoke

  release:
    needs: [build]
    # Only a manual run on main releases; a push or a pull request never does.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
