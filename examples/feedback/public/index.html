<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #171717; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; }
    pre { background: #f5f5f5; padding: .75rem; overflow: auto; font-size: 13px; }
    #note { min-height: 1.5rem; font-weight: 600; }
    .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>Tell us what went wrong</h1>

  <form id="form">
    <label for="words">What happened?</label>
    <textarea id="words" rows="4" maxlength="2500" required>The save button does nothing</textarea>
    <div class="row">
      <label><input id="reply" type="checkbox"> Tell me when it is fixed</label>
      <button type="submit">Send</button>
      <button type="button" id="break">Break something first</button>
    </div>
  </form>
  <p id="note" role="status"></p>

  <div class="row">
    <label for="mode">Pretend the server says</label>
    <select id="mode">
      <option value="ok">it took it</option>
      <option value="unauthorized">the key is wrong (401)</option>
      <option value="payment">the project has no card (402)</option>
      <option value="limited">too many calls (429, retry in 30 s)</option>
      <option value="refused">no (400)</option>
      <option value="down">it is down (503)</option>
      <option value="html">a hotel Wi-Fi page</option>
    </select>
  </div>

  <div class="row">
    <label for="state">Pretend the entries are</label>
    <select id="state">
      <option value="received">received (we have it)</option>
      <option value="known">a known problem</option>
      <option value="fixed">fixed</option>
    </select>
    <span>then reload the page: it asks once per page view</span>
  </div>

  <h2>Sent from this device</h2>
  <ul id="sent"></ul>
  <h2>What the server received last</h2>
  <pre id="last">nothing yet</pre>

  <script type="module">
    // The browser entry: it also records the page's requests, so a failed one can go with the words.
    import { init, captureException } from "/sdk/browser/index.js";
    import { sendFeedback, deleteFeedback, listFeedback, feedbackStatus, answerFeedback } from "/sdk/feedback/index.js";

    init({ dsn: `${location.origin}/api/overseer`, clientKey: "osk_example", environment: "example", release: "1.0.0" });

    // Each result in words. `reason` is the whole list the SDK can answer.
    const WORDS = {
      not_configured: "Feedback is switched off in this app.",
      empty: "Write a few words first.",
      too_long: "That is too long: 2,000 characters at most.",
      unauthorized: "This app's key is not accepted. Tell its developer.",
      payment_required: "This app cannot take feedback at the moment.",
      rate_limited: (r) => `Too many messages. Try again in ${Math.ceil((r.retryAfterMs ?? 60000) / 1000)} seconds.`,
      refused: (r) => `The message was refused (${r.status}). That is a bug in this page.`,
      unavailable: "We could not reach the server. Your words are still in the box: try again.",
    };

    const $ = (id) => document.getElementById(id);
    const say = (text) => ($("note").textContent = text);

    // What became of an entry, in words. `release` and `reply` are the server's own text: put in with textContent, never as HTML.
    const STATE_WORDS = {
      received: () => "We have it.",
      known: () => "It is a known problem.",
      fixed: (s) => (s.release ? `Fixed in ${s.release}.` : "Fixed."),
    };
    const ANSWER_WORDS = { better: "You said it works now.", not_better: "You said it is still broken." };

    // asked once per page view, for the newest few only; a not_found keeps the receipt (an older server has no such door)
    const statuses = new Map();
    async function readStates() {
      for (const { id } of listFeedback().slice(0, 3)) statuses.set(id, await feedbackStatus(id));
      showSent();
    }

    function statusLine(id, li) {
      const s = statuses.get(id);
      if (!s) return;
      const line = document.createElement("div");
      line.textContent = s.ok ? STATE_WORDS[s.state](s) : "";
      li.append(line);
      if (!s.ok || s.state !== "fixed") return;
      if (s.reply) {
        const reply = document.createElement("blockquote");
        reply.textContent = s.reply;
        li.append(reply);
      }
      if (s.answer) {
        const said = document.createElement("div");
        said.textContent = ANSWER_WORDS[s.answer];
        li.append(said);
      }
      for (const [label, better] of [["It works now", true], ["Still broken", false]]) {
        const button = document.createElement("button");
        button.textContent = label;
        button.onclick = async () => {
          const r = await answerFeedback(id, better);
          if (r.ok) statuses.set(id, r);
          say(r.ok ? "Thank you for telling us." : r.reason === "not_fixed" ? "It is not marked as fixed any more." : r.reason === "rate_limited" ? "Too many answers: try again later." : "Could not send that: try again.");
          showSent();
        };
        li.append(button);
      }
    }

    async function showSent() {
      const list = $("sent");
      list.replaceChildren(...listFeedback().map(({ id, at }) => {
        const li = document.createElement("li");
        li.textContent = `${id}, ${at} `;
        const button = document.createElement("button");
        button.textContent = "Take it back";
        button.onclick = async () => {
          const r = await deleteFeedback(id);
          say(r.ok ? "Taken back." : r.reason === "not_found" ? "Already gone." : "Could not reach the server: try again.");
          showSent();
        };
        li.append(button);
        statusLine(id, li);
        return li;
      }));
      $("last").textContent = JSON.stringify(await (await fetch("/demo/last")).json(), null, 2);
    }

    $("state").onchange = () => fetch("/demo/state", { method: "POST", body: JSON.stringify({ state: $("state").value }) });
    $("mode").onchange = () => fetch("/demo/mode", { method: "POST", body: JSON.stringify({ mode: $("mode").value }) });

    // An error and a failed request, so the feedback carries both.
    $("break").onclick = async () => {
      await fetch("/api/boom").catch(() => undefined);
      captureException(new Error("The save button threw"));
      say("Something broke. Now send your feedback.");
    };

    $("form").onsubmit = async (event) => {
      event.preventDefault();
      say("Sending…");
      const result = await sendFeedback({ text: $("words").value, replyWhenFixed: $("reply").checked });
      if (result.ok) {
        say(result.known ? "Thank you: we know this problem." : "Thank you: we have it.");
        $("words").value = "";
      } else {
        const words = WORDS[result.reason];
        say(typeof words === "function" ? words(result) : words);
      }
      showSent();
    };
    showSent();
    readStates();
  </script>
</body>
</html>
